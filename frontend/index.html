<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ImHere</title>
    <!-- CSS/JSの入口だけを読み込み、詳細は各ディレクトリ内で分割管理します。 -->
    <link rel="stylesheet" href="/frontend/css/main.css">
    <script type="module" src="/frontend/js/main.js"></script>
  </head>
  <body>
    <!-- JSがこの要素の中身をログイン画面またはアプリ画面に差し替えます。 -->
    <div id="app" class="app-root" aria-busy="true">
      <div class="boot-screen">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" role="img">
            <path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18Zm.75 13.5h-1.5v-6h1.5v6Zm0-8h-1.5V7h1.5v1.5Z"></path>
          </svg>
        </div>
        <p>imhere</p>
      </div>
    </div>
    <!-- toast.jsが短い通知メッセージをここへ表示します。 -->
    <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
  </body>
</html>
